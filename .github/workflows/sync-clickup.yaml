
name: Sync GitHub Issues to ClickUp

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  create-clickup-task:
    if: ${{ github.event.issue.pull_request == null }}
    runs-on: ubuntu-latest

    steps:
      - name: Create ClickUp task
        uses: actions/github-script@v7
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          CLICKUP_LIST_ID: ${{ secrets.CLICKUP_LIST_ID }}
        with:
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Prevent duplicate task creation on workflow reruns.
            const marker = `<!-- clickup-sync:${owner}/${repo}#${issue.number} -->`;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: issue.number,
                per_page: 100,
              }
            );

            if (comments.some(c => c.body?.includes(marker))) {
              core.info("ClickUp task already exists.");
              return;
            }

            const labels = (issue.labels || [])
              .map(label => typeof label === "string" ? label : label.name)
              .filter(Boolean);

            const description = [
              "## GitHub Issue",
              `- **Repository:** ${owner}/${repo}`,
              `- **Issue:** [#${issue.number}](${issue.html_url})`,
              `- **Author:** @${issue.user.login}`,
              `- **Labels:** ${labels.length ? labels.join(", ") : "None"}`,
              "",
              "## Description",
              issue.body?.trim() || "_No description provided._",
            ].join("\n");

            const response = await fetch(
              `https://api.clickup.com/api/v2/list/${process.env.CLICKUP_LIST_ID}/task`,
              {
                method: "POST",
                headers: {
                  Authorization: process.env.CLICKUP_API_TOKEN,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  name: `[${repo} #${issue.number}] ${issue.title}`,
                  markdown_description: description,
                }),
              }
            );

            const raw = await response.text();

            if (!response.ok) {
              throw new Error(`ClickUp API ${response.status}: ${raw}`);
            }

            const task = JSON.parse(raw);

            // Add the ClickUp task link to the GitHub issue.
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: [
                `✅ ClickUp task created: ${task.url}`,
                "",
                marker,
              ].join("\n"),
            });
